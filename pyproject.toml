[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultsieve"
version = "1.0.0"
description = "Audit exported password vaults for duplicates and password security issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.0"]
license = "MIT"
authors = [
  { name = "Adrii" },
]
keywords = [
  "bitwarden",
  "breach-check",
  "cli",
  "csv",
  "passwords",
  "security",
  "tui",
  "vault",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/AdrianVillamayor/VaultSieve"
Repository = "https://github.com/AdrianVillamayor/VaultSieve"
Issues = "https://github.com/AdrianVillamayor/VaultSieve/issues"
Changelog = "https://github.com/AdrianVillamayor/VaultSieve/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.11", "twine>=6.0"]

[project.scripts]
vaultsieve = "vaultsieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"assets/logos" = ["assets/logos/vaultsieve-icon.svg", "assets/logos/vaultsieve-wordmark.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
